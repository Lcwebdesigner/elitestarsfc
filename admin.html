<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Admin | Elite Stars FC</title>

<style>
:root{
    --navy:#0A1931;
    --red:#C8102E;
    --red-dark:#a80d26;
    --light:#f4f6f9;
    --gray:#687386;
    --border:#e1e5eb;
    --green:#1b6e3b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:var(--navy);
    line-height:1.5;
    padding-bottom:60px;
}

header{
    background:var(--navy);
    color:#fff;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header strong{
    font-size:15px;
}

header button{
    background:var(--red);
    color:#fff;
    border:0;
    padding:8px 14px;
    border-radius:4px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
}

.wrap{
    width:min(720px,92%);
    margin:25px auto;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:6px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 8px 20px rgba(10,25,49,.06);
}

h2{
    font-size:16px;
    margin-bottom:12px;
    color:var(--navy);
}

label{
    display:block;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
    color:var(--gray);
    margin:10px 0 4px;
    text-transform:uppercase;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:4px;
    font-size:14px;
    font-family:inherit;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.row{
    display:flex;
    gap:10px;
}

.row > div{
    flex:1;
}

.btn{
    display:inline-block;
    background:var(--red);
    color:#fff;
    border:0;
    padding:11px 18px;
    border-radius:4px;
    font-weight:800;
    font-size:13px;
    margin-top:14px;
    cursor:pointer;
}

.btn:hover{
    background:var(--red-dark);
}

.btn-outline{
    background:#fff;
    color:var(--navy);
    border:2px solid var(--navy);
}

.btn-small{
    padding:6px 10px;
    font-size:11px;
    margin:0 0 0 6px;
}

.list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid var(--border);
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:13px;
    gap:10px;
}

.list-item div:first-child{
    flex:1;
}

.list-item small{
    color:var(--gray);
    display:block;
    font-size:11px;
    margin-top:3px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.tab{
    background:#fff;
    border:1px solid var(--border);
    padding:9px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
}

.tab-panel{
    display:none;
}

.tab-panel.active{
    display:block;
}

.note{
    background:#fff7ea;
    border:1px solid #f2d9a1;
    padding:12px;
    border-radius:4px;
    font-size:12px;
    color:#7a5b12;
    margin-bottom:18px;
}

.success{
    color:var(--green);
    font-size:12px;
    margin-top:8px;
}

.error{
    color:var(--red);
    font-size:12px;
    margin-top:8px;
}

#loginScreen{
    max-width:340px;
    margin:80px auto;
    text-align:center;
}

#loginScreen h1{
    font-size:18px;
    margin-bottom:16px;
}

#loginScreen input{
    margin-bottom:8px;
}

#loginError{
    color:var(--red);
    font-size:12px;
    margin-top:8px;
    display:none;
}

#resetMessage{
    font-size:12px;
    margin-top:8px;
}

.empty{
    color:var(--gray);
    font-size:13px;
}

@media(max-width:600px){

    .row{
        flex-direction:column;
        gap:0;
    }

    .list-item{
        flex-direction:column;
        align-items:flex-start;
    }

    .list-item > div:last-child{
        width:100%;
    }

    .btn-small{
        margin-left:0;
        margin-right:5px;
    }
}
</style>
</head>

<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://qwftlxobrdhthpfkbqhq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_ayuGaIFLxTUE8Htw329SAw_8w7XiskU";

const ADMIN_EMAIL =
"jssarablow@gmail.com";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   LOGIN
===================================================== */

async function tryLogin(){

    const email =
        document
        .getElementById("emailInput")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("passwordInput")
        .value;

    const error =
        document.getElementById("loginError");

    error.style.display = "none";

    if(!email || !password){

        error.textContent =
            "Enter your email and password.";

        error.style.display = "block";

        return;
    }


    if(email !== ADMIN_EMAIL){

        error.textContent =
            "This account is not authorized.";

        error.style.display = "block";

        return;
    }


    const { data, error: loginError } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if(loginError){

        error.textContent =
            loginError.message ||
            "Incorrect email or password.";

        error.style.display = "block";

        return;
    }


    if(!data.session){

        error.textContent =
            "Login failed.";

        error.style.display = "block";

        return;
    }


    await showPanel();
}


/* =====================================================
   PASSWORD RESET
===================================================== */

async function sendResetEmail(){

    const email =
        document
        .getElementById("emailInput")
        .value
        .trim()
        .toLowerCase();

    const error =
        document.getElementById("loginError");

    const message =
        document.getElementById("resetMessage");


    error.style.display = "none";
    message.textContent = "";


    if(email !== ADMIN_EMAIL){

        error.textContent =
            "Enter the authorized admin email: " +
            ADMIN_EMAIL;

        error.style.display = "block";

        return;
    }


    const { error: resetError } =
        await supabaseClient.auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:
                "https://elitestarsfc.vercel.app/reset-password.html"
            }
        );


    if(resetError){

        error.textContent =
            resetError.message;

        error.style.display = "block";

        return;
    }


    message.style.color =
        "var(--green)";

    message.textContent =
        "Password reset link sent. Check your email.";
}


/* =====================================================
   SESSION
===================================================== */

async function checkAdminSession(){

    const { data } =
        await supabaseClient.auth.getSession();


    if(
        data &&
        data.session &&
        data.session.user.email.toLowerCase()
        === ADMIN_EMAIL
    ){

        await showPanel();

    }

}


async function showPanel(){

    document
    .getElementById("loginScreen")
    .style.display = "none";


    document
    .getElementById("adminPanel")
    .style.display = "block";


    await initData();
}


async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();
}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document
.getElementById("passwordInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            tryLogin();
        }

    }
);


/* =====================================================
   TABS
===================================================== */

function switchTab(name){

    document
    .querySelectorAll(".tab")
    .forEach(function(tab){

        tab.classList.toggle(
            "active",
            tab.dataset.tab === name
        );

    });


    document
    .querySelectorAll(".tab-panel")
    .forEach(function(panel){

        panel.classList.remove("active");

    });


    const panel =
        document.getElementById(
            "panel-" + name
        );

    if(panel){
        panel.classList.add("active");
    }
}


/* =====================================================
   DATA
===================================================== */

let players = [];
let fixtures = [];
let news = [];


async function initData(){

    await loadPlayers();

    await loadFixtures();

    await loadNews();
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* =====================================================
   PLAYER PHOTO
===================================================== */

function handlePhotoFile(input){

    const file =
        input.files[0];

    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
    function(event){

        const img =
            new Image();


        img.onload =
        function(){

            const maxDim = 500;

            let width =
                img.width;

            let height =
                img.height;


            if(
                width >= height &&
                width > maxDim
            ){

                height =
                    Math.round(
                        height *
                        maxDim /
                        width
                    );

                width = maxDim;

            }
            else if(
                height > width &&
                height > maxDim
            ){

                width =
                    Math.round(
                        width *
                        maxDim /
                        height
                    );

                height = maxDim;
            }


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width = width;
            canvas.height = height;


            canvas
            .getContext("2d")
            .drawImage(
                img,
                0,
                0,
                width,
                height
            );


            const dataUrl =
                canvas.toDataURL(
                    "image/jpeg",
                    0.75
                );


            document
            .getElementById("playerPhoto")
            .value = dataUrl;


            showPhotoPreview(dataUrl);

        };


        img.src =
            event.target.result;

    };


    reader.readAsDataURL(file);
}


function showPhotoPreview(src){

    const preview =
        document.getElementById(
            "photoPreview"
        );


    if(src){

        preview.src = src;

        preview.style.display =
            "block";

    }
    else{

        preview.src = "";

        preview.style.display =
            "none";

    }
}


document
.getElementById("playerPhoto")
.addEventListener(
    "input",
    function(){

        showPhotoPreview(
            this.value.trim()
        );

    }
);


/* =====================================================
   PLAYERS
===================================================== */

async function loadPlayers(){

    const { data, error } =
        await supabaseClient
        .from("players")
        .select("*")
        .order(
            "number",
            {
                ascending:true,
                nullsFirst:false
            }
        );


    if(error){

        console.error(
            "Load players error:",
            error
        );

        players = [];

        renderPlayers();

        return;
    }


    players = data || [];

    renderPlayers();
}


function renderPlayers(){

    const list =
        document.getElementById(
            "playerList"
        );


    document.getElementById(
        "playerCount"
    ).textContent =
        players.length;


    if(!players.length){

        list.innerHTML =
            '<p class="empty">No players yet.</p>';

        return;
    }


    list.innerHTML =
        players.map(function(player){

            return `

            <div class="list-item">

                <div>

                    <strong>
                        ${escapeHtml(player.name)}
                    </strong>

                    — ${escapeHtml(player.position)}
                    #${player.number || ""}

                    <small>
                        Apps ${player.appearances || 0}
                        · Goals ${player.goals || 0}
                        · Assists ${player.assists || 0}
                        ${player.photo ? " · Photo added" : ""}
                    </small>

                </div>

                <div>

                    <button
                        class="btn btn-small btn-outline"
                        onclick="editPlayer(${player.id})"
                    >
                        Edit
                    </button>
