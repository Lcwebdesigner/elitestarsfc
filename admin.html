<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Admin | Elite Stars FC</title>

<style>
:root{
    --navy:#0A1931;
    --red:#C8102E;
    --red-dark:#a80d26;
    --light:#f4f6f9;
    --gray:#687386;
    --border:#e1e5eb;
    --green:#1b6e3b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:var(--navy);
    line-height:1.5;
    padding-bottom:60px;
}

header{
    background:var(--navy);
    color:#fff;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header strong{
    font-size:15px;
}

header button{
    background:var(--red);
    color:#fff;
    border:0;
    padding:8px 14px;
    border-radius:4px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
}

.wrap{
    width:min(720px,92%);
    margin:25px auto;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:6px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 8px 20px rgba(10,25,49,.06);
}

h2{
    font-size:16px;
    margin-bottom:12px;
    color:var(--navy);
}

label{
    display:block;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
    color:var(--gray);
    margin:10px 0 4px;
    text-transform:uppercase;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:4px;
    font-size:14px;
    font-family:inherit;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.row{
    display:flex;
    gap:10px;
}

.row > div{
    flex:1;
}

.btn{
    display:inline-block;
    background:var(--red);
    color:#fff;
    border:0;
    padding:11px 18px;
    border-radius:4px;
    font-weight:800;
    font-size:13px;
    margin-top:14px;
    cursor:pointer;
}

.btn:hover{
    background:var(--red-dark);
}

.btn-outline{
    background:#fff;
    color:var(--navy);
    border:2px solid var(--navy);
}

.btn-small{
    padding:6px 10px;
    font-size:11px;
    margin:0 0 0 6px;
}

.list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid var(--border);
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:13px;
    gap:10px;
}

.list-item div:first-child{
    flex:1;
}

.list-item small{
    color:var(--gray);
    display:block;
    font-size:11px;
    margin-top:3px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.tab{
    background:#fff;
    border:1px solid var(--border);
    padding:9px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
}

.tab-panel{
    display:none;
}

.tab-panel.active{
    display:block;
}

.note{
    background:#fff7ea;
    border:1px solid #f2d9a1;
    padding:12px;
    border-radius:4px;
    font-size:12px;
    color:#7a5b12;
    margin-bottom:18px;
}

.success{
    color:var(--green);
    font-size:12px;
    margin-top:8px;
}

.error{
    color:var(--red);
    font-size:12px;
    margin-top:8px;
}

#loginScreen{
    max-width:340px;
    margin:80px auto;
    text-align:center;
}

#loginScreen h1{
    font-size:18px;
    margin-bottom:16px;
}

#loginScreen input{
    margin-bottom:8px;
}

#loginError{
    color:var(--red);
    font-size:12px;
    margin-top:8px;
    display:none;
}

#resetMessage{
    font-size:12px;
    margin-top:8px;
}

.empty{
    color:var(--gray);
    font-size:13px;
}

@media(max-width:600px){

    .row{
        flex-direction:column;
        gap:0;
    }

    .list-item{
        flex-direction:column;
        align-items:flex-start;
    }

    .list-item > div:last-child{
        width:100%;
    }

    .btn-small{
        margin-left:0;
        margin-right:5px;
    }
}
</style>
</head>

<body>

Goalkeeper

<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */
const SUPABASE_URL = "https://qwftlxobrdhthpfkbqhq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ayuGaIFLxTUE8Htw329SAw_8w7XiskU";
const ADMIN_EMAIL = "jssarablow@gmail.com";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* =====================================================
   LOGIN
===================================================== */
async function tryLogin(){
  const email = document.getElementById("emailInput").value.trim().toLowerCase();
  const password = document.getElementById("passwordInput").value;
  const error = document.getElementById("loginError");
  error.style.display = "none";

  if(!email || !password){
    error.textContent = "Enter your email and password.";
    error.style.display = "block";
    return;
  }
  if(email !== ADMIN_EMAIL){
    error.textContent = "This account is not authorized.";
    error.style.display = "block";
    return;
  }

  const { data, error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(loginError){
    error.textContent = loginError.message || "Incorrect email or password.";
    error.style.display = "block";
    return;
  }
  if(!data.session){
    error.textContent = "Login failed.";
    error.style.display = "block";
    return;
  }

  await showPanel();
}

/* =====================================================
   PASSWORD RESET
===================================================== */
async function sendResetEmail(){
  const emailField = document.getElementById("emailInput");
  const email = emailField.value.trim().toLowerCase();
  const error = document.getElementById("loginError");
  const message = document.getElementById("resetMessage");
  error.style.display = "none";
  message.textContent = "";

  if(!email){
    error.textContent = "Enter your email above, then tap \"Forgot Password?\" again.";
    error.style.display = "block";
    emailField.focus();
    return;
  }

  if(email !== ADMIN_EMAIL){
    error.textContent = "This account is not authorized.";
    error.style.display = "block";
    return;
  }

  const { error: resetError } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://elitestarsfc.vercel.app/reset-password.html"
  });

  if(resetError){
    error.textContent = resetError.message;
    error.style.display = "block";
    return;
  }

  message.style.color = "var(--green)";
  message.textContent = "Password reset link sent. Check your email.";
}

/* =====================================================
   SESSION
===================================================== */
async function checkAdminSession(){
  const { data } = await supabaseClient.auth.getSession();
  if(data && data.session && data.session.user.email.toLowerCase() === ADMIN_EMAIL){
    await showPanel();
  }
}

async function showPanel(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";
  await initData();
}

async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

document.getElementById("passwordInput").addEventListener("keydown", function(event){
  if(event.key === "Enter"){ tryLogin(); }
});

/* =====================================================
   TABS
===================================================== */
function switchTab(name){
  document.querySelectorAll(".tab").forEach(function(tab){
    tab.classList.toggle("active", tab.dataset.tab === name);
  });
  document.querySelectorAll(".tab-panel").forEach(function(panel){
    panel.classList.remove("active");
  });
  const panel = document.getElementById("panel-" + name);
  if(panel){ panel.classList.add("active"); }
}

/* =====================================================
   DATA
===================================================== */
let players = [];
let fixtures = [];
let news = [];

async function initData(){
  await loadPlayers();
  await loadFixtures();
  await loadNews();
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =====================================================
   PLAYER PHOTO (resize + compress to base64)
===================================================== */
function handlePhotoFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(event){
    const img = new Image();
    img.onload = function(){
      const maxDim = 500;
      let width = img.width, height = img.height;
      if(width >= height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
      else if(height > width && height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      document.getElementById("playerPhoto").value = dataUrl;
      showPhotoPreview(dataUrl);
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function showPhotoPreview(src){
  const preview = document.getElementById("photoPreview");
  if(src){ preview.src = src; preview.style.display = "block"; }
  else{ preview.src = ""; preview.style.display = "none"; }
}

document.getElementById("playerPhoto").addEventListener("input", function(){
  showPhotoPreview(this.value.trim());
});

/* =====================================================
   PLAYERS  (table: players — id, name, position, number, photo, appearances, goals, assists)
===================================================== */
async function loadPlayers(){
  const { data, error } = await supabaseClient
    .from("players")
    .select("*")
    .order("number", { ascending: true, nullsFirst: false });

  if(error){ console.error("Load players error:", error); players = []; renderPlayers(); return; }
  players = data || [];
  renderPlayers();
}

function renderPlayers(){
  const list = document.getElementById("playerList");
  document.getElementById("playerCount").textContent = players.length;

  if(!players.length){
    list.innerHTML = '<p class="empty">No players yet.</p>';
    return;
  }

  list.innerHTML = players.map(function(p){
    return '<div class="list-item">' +
      '<div><strong>' + escapeHtml(p.name) + '</strong> — ' + escapeHtml(p.position) + ' #' + (p.number || '') +
        '<small>Apps ' + (p.appearances||0) + ' · Goals ' + (p.goals||0) + ' · Assists ' + (p.assists||0) +
        (p.photo ? ' · Photo added' : '') + '</small></div>' +
      '<div>' +
        '<button class="btn btn-small btn-outline" onclick="editPlayer(' + p.id + ')">Edit</button>' +
        '<button class="btn btn-small" onclick="deletePlayer(' + p.id + ')">Delete</button>' +
      '</div></div>';
  }).join("");
}

async function savePlayer(){
  const id = document.getElementById("playerId").value;
  const name = document.getElementById("playerName").value.trim();
  if(!name){ alert("Player name is required."); return; }

  const record = {
    name: name,
    position: document.getElementById("playerPosition").value,
    number: Number(document.getElementById("playerNumber").value) || null,
    photo: document.getElementById("playerPhoto").value.trim(),
    appearances: Number(document.getElementById("playerApps").value) || 0,
    goals: Number(document.getElementById("playerGoals").value) || 0,
    assists: Number(document.getElementById("playerAssists").value) || 0
  };

  let result;
  if(id){
    result = await supabaseClient.from("players").update(record).eq("id", Number(id));
  } else {
    result = await supabaseClient.from("players").insert(record);
  }

  if(result.error){ alert("Save failed: " + result.error.message); return; }
  resetPlayerForm();
  await loadPlayers();
}

function editPlayer(id){
  const p = players.find(function(x){ return x.id === id; });
  if(!p) return;
  document.getElementById("playerId").value = p.id;
  document.getElementById("playerName").value = p.name || "";
  document.getElementById("playerNumber").value = p.number || "";
  document.getElementById("playerPosition").value = p.position || "Goalkeeper";
  document.getElementById("playerPhoto").value = p.photo || "";
  showPhotoPreview(p.photo || "");
  document.getElementById("playerApps").value = p.appearances || 0;
  document.getElementById("playerGoals").value = p.goals || 0;
  document.getElementById("playerAssists").value = p.assists || 0;
  document.getElementById("playerFormTitle").textContent = "Edit Player";
  document.getElementById("playerSaveBtn").textContent = "Save Changes";
  window.scrollTo(0,0);
}

async function deletePlayer(id){
  if(!confirm("Delete this player?")) return;
  const { error } = await supabaseClient.from("players").delete().eq("id", id);
  if(error){ alert("Delete failed: " + error.message); return; }
  await loadPlayers();
}

function resetPlayerForm(){
  document.getElementById("playerId").value = "";
  document.getElementById("playerName").value = "";
  document.getElementById("playerNumber").value = "";
  document.getElementById("playerPosition").value = "Goalkeeper";
  document.getElementById("playerPhoto").value = "";
  document.getElementById("playerPhotoFile").value = "";
  showPhotoPreview("");
  document.getElementById("playerApps").value = 0;
  document.getElementById("playerGoals").value = 0;
  document.getElementById("playerAssists").value = 0;
  document.getElementById("playerFormTitle").textContent = "Add Player";
  document.getElementById("playerSaveBtn").textContent = "Add Player";
}

/* =====================================================
   FIXTURES  (table: fixtures — id, home, away, date, time, venue)
===================================================== */
async function loadFixtures(){
  const { data, error } = await supabaseClient
    .from("fixtures")
    .select("*")
    .order("date", { ascending: true, nullsFirst: false });

  if(error){ console.error("Load fixtures error:", error); fixtures = []; renderFixtures(); return; }
  fixtures = data || [];
  renderFixtures();
}

function renderFixtures(){
  const list = document.getElementById("fixtureList");
  document.getElementById("fixtureCount").textContent = fixtures.length;

  if(!fixtures.length){
    list.innerHTML = '<p class="empty">No fixtures yet.</p>';
    return;
  }

  list.innerHTML = fixtures.map(function(f){
    return '<div class="list-item">' +
      '<div><strong>' + escapeHtml(f.home_team) + '</strong> vs <strong>' + escapeHtml(f.away_team) + '</strong>' +
        '<small>' + escapeHtml(f.date||'') + ' ' + escapeHtml(f.time||'') + (f.venue ? ' · ' + escapeHtml(f.venue) : '') + '</small></div>' +
      '<div>' +
        '<button class="btn btn-small btn-outline" onclick="editFixture(' + f.id + ')">Edit</button>' +
        '<button class="btn btn-small" onclick="deleteFixture(' + f.id + ')">Delete</button>' +
      '</div></div>';
  }).join("");
}

async function saveFixture(){
  const id = document.getElementById("fixtureId").value;
  const home = document.getElementById("fixtureHome").value.trim();
  const away = document.getElementById("fixtureAway").value.trim();
  if(!home || !away){ alert("Home and away team are required."); return; }

  const record = {
    home_team: home,
    away_team: away,
    date: document.getElementById("fixtureDate").value || null,
    time: document.getElementById("fixtureTime").value || null,
    venue: document.getElementById("fixtureVenue").value.trim()
  };

  let result;
  if(id){
    result = await supabaseClient.from("fixtures").update(record).eq("id", Number(id));
  } else {
    result = await supabaseClient.from("fixtures").insert(record);
  }

  if(result.error){ alert("Save failed: " + result.error.message); return; }
  resetFixtureForm();
  await loadFixtures();
}

function editFixture(id){
  const f = fixtures.find(function(x){ return x.id === id; });
  if(!f) return;
  document.getElementById("fixtureId").value = f.id;
  document.getElementById("fixtureHome").value = f.home_team || "";
  document.getElementById("fixtureAway").value = f.away_team || "";
  document.getElementById("fixtureDate").value = f.date || "";
  document.getElementById("fixtureTime").value = f.time || "";
  document.getElementById("fixtureVenue").value = f.venue || "";
  document.getElementById("fixtureFormTitle").textContent = "Edit Fixture";
  document.getElementById("fixtureSaveBtn").textContent = "Save Changes";
  window.scrollTo(0,0);
}

async function deleteFixture(id){
  if(!confirm("Delete this fixture?")) return;
  const { error } = await supabaseClient.from("fixtures").delete().eq("id", id);
  if(error){ alert("Delete failed: " + error.message); return; }
  await loadFixtures();
}

function resetFixtureForm(){
  document.getElementById("fixtureId").value = "";
  document.getElementById("fixtureHome").value = "Elite Stars FC";
  document.getElementById("fixtureAway").value = "";
  document.getElementById("fixtureDate").value = "";
  document.getElementById("fixtureTime").value = "";
  document.getElementById("fixtureVenue").value = "";
  document.getElementById("fixtureFormTitle").textContent = "Add Fixture";
  document.getElementById("fixtureSaveBtn").textContent = "Add Fixture";
}

/* =====================================================
   NEWS  (table: news — id, title, date, image, content)
===================================================== */
async function loadNews(){
  const { data, error } = await supabaseClient
    .from("news")
    .select("*")
    .order("date", { ascending: false, nullsFirst: false });

  if(error){ console.error("Load news error:", error); news = []; renderNews(); return; }
  news = data || [];
  renderNews();
}

function renderNews(){
  const list = document.getElementById("newsList");
  document.getElementById("newsCount").textContent = news.length;

  if(!news.length){
    list.innerHTML = '<p class="empty">No news yet.</p>';
    return;
  }

  list.innerHTML = news.map(function(n){
    return '<div class="list-item">' +
      '<div><strong>' + escapeHtml(n.title) + '</strong>' +
        '<small>' + escapeHtml(n.date||'') + (n.image ? ' · has image' : '') + '</small></div>' +
      '<div>' +
        '<button class="btn btn-small btn-outline" onclick="editNews(' + n.id + ')">Edit</button>' +
        '<button class="btn btn-small" onclick="deleteNews(' + n.id + ')">Delete</button>' +
      '</div></div>';
  }).join("");
}

async function saveNews(){
  const id = document.getElementById("newsId").value;
  const title = document.getElementById("newsTitle").value.trim();
  if(!title){ alert("Title is required."); return; }

  const record = {
    title: title,
    date: document.getElementById("newsDate").value || null,
    image: document.getElementById("newsImage").value.trim(),
    content: document.getElementById("newsContent").value.trim()
  };

  let result;
  if(id){
    result = await supabaseClient.from("news").update(record).eq("id", Number(id));
  } else {
    result = await supabaseClient.from("news").insert(record);
  }

  if(result.error){ alert("Save failed: " + result.error.message); return; }
  resetNewsForm();
  await loadNews();
}

function editNews(id){
  const n = news.find(function(x){ return x.id === id; });
  if(!n) return;
  document.getElementById("newsId").value = n.id;
  document.getElementById("newsTitle").value = n.title || "";
  document.getElementById("newsDate").value = n.date || "";
  document.getElementById("newsImage").value = n.image || "";
  document.getElementById("newsContent").value = n.content || "";
  document.getElementById("newsFormTitle").textContent = "Edit News";
  document.getElementById("newsSaveBtn").textContent = "Save Changes";
  window.scrollTo(0,0);
}

async function deleteNews(id){
  if(!confirm("Delete this news item?")) return;
  const { error } = await supabaseClient.from("news").delete().eq("id", id);
  if(error){ alert("Delete failed: " + error.message); return; }
  await loadNews();
}

function resetNewsForm(){
  document.getElementById("newsId").value = "";
  document.getElementById("newsTitle").value = "";
  document.getElementById("newsDate").value = "";
  document.getElementById("newsImage").value = "";
  document.getElementById("newsContent").value = "";
  document.getElementById("newsFormTitle").textContent = "Add News";
  document.getElementById("newsSaveBtn").textContent = "Add News";
}

   INIT
===================================================== */
checkAdminSession();

</script>
