<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reset Password | Elite Stars FC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0A1931;--red:#C8102E;--red-dark:#a80d26;--light:#f4f6f9;--gray:#687386;--border:#e1e5eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:8px;padding:25px;box-shadow:0 8px 24px rgba(10,25,49,.08)}
h1{font-size:21px;margin-bottom:8px}
p{font-size:13px;color:var(--gray);line-height:1.5;margin-bottom:18px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--gray);margin:12px 0 5px;text-transform:uppercase}
input{width:100%;padding:11px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-family:inherit}
button{width:100%;background:var(--red);color:#fff;border:0;padding:12px;border-radius:4px;font-weight:800;font-size:13px;margin-top:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
button:hover:not(:disabled){background:var(--red-dark)}
.secondary{display:block;text-align:center;margin-top:14px;color:var(--navy);font-size:13px;text-decoration:none}
#message{font-size:13px;margin-top:12px;line-height:1.5}
.success{color:#1b6e3b}.error{color:var(--red)}
</style>
</head>
<body>
<div class="card">
  <h1>Reset Admin Password</h1>
  <p>Enter a new password for the Elite Stars FC admin account.</p>
  <label>New Password</label>
  <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
  <label>Confirm New Password</label>
  <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
  <button id="updateBtn" onclick="updatePassword()">Update Password</button>
  <a class="secondary" href="admin.html">Back to Admin Login</a>
  <div id="message"></div>
</div>
<script>
const SUPABASE_URL = "https://qwftlxobrdhthpfkbqhq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ayuGaIFLxTUE8Htw329SAw_8w7XiskU";
const ADMIN_EMAIL = "jssarablow@gmail.com";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let recoveryReady = false;
function showMessage(text,type){const el=document.getElementById("message");el.className=type||"";el.textContent=text;}
supabaseClient.auth.onAuthStateChange(function(event,session){
  if(event === "PASSWORD_RECOVERY" && session && session.user){
    if((session.user.email||"").toLowerCase() !== ADMIN_EMAIL){showMessage("This recovery link is not for the Elite Stars FC admin account.","error");return;}
    recoveryReady=true;showMessage("Recovery link verified. Enter your new password.","success");
  }
});
async function checkSession(){
  const {data}=await supabaseClient.auth.getSession();
  if(data && data.session && data.session.user && (data.session.user.email||"").toLowerCase()===ADMIN_EMAIL){
    recoveryReady=true;showMessage("Recovery link verified. Enter your new password.","success");
  }
}
checkSession();
async function updatePassword(){
  const password=document.getElementById("newPassword").value;
  const confirm=document.getElementById("confirmPassword").value;
  const button=document.getElementById("updateBtn");
  if(!recoveryReady){showMessage("This reset link is invalid or expired. Request a new reset link from the Admin Login page.","error");return;}
  if(password.length < 6){showMessage("Password must be at least 6 characters.","error");return;}
  if(password !== confirm){showMessage("The passwords do not match.","error");return;}
  button.disabled=true;button.textContent="Updating...";
  const {error}=await supabaseClient.auth.updateUser({password:password});
  if(error){button.disabled=false;button.textContent="Update Password";showMessage(error.message||"Could not update password.","error");return;}
  showMessage("Password updated successfully. You can now log in with your new password.","success");
  button.textContent="Password Updated";
  document.getElementById("newPassword").value="";document.getElementById("confirmPassword").value="";
  await supabaseClient.auth.signOut();
}
</script>
</body>
</html>
